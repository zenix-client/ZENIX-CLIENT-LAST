name: Build ZENIX CLIENT

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          set -e
          ARCHIVE=$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -path './.git/*' | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No ZIP archive found in repository."
            echo "Files in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Using archive: $ARCHIVE"
          mkdir -p project
          unzip -oq "$ARCHIVE" -d project

          BUILD_FILE=$(find project -maxdepth 4 -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found inside ZIP."
            find project -maxdepth 4 -type f
            exit 1
          fi

          echo "BUILD_FILE=$BUILD_FILE" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$BUILD_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build mod
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload JAR files
        uses: actions/upload-artifact@v4
        with:
          name: ZENIX-CLIENT-JAR
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14
